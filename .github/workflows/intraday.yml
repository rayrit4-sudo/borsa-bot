name: Gun ici tarama

on:
  schedule:
    # 07:00-21:00 UTC = 10:00-00:00 TR (BIST + ABD piyasa saatlerini kapsar), hafta ici
    - cron: "*/15 6-21 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: borsa-bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Botu calistir
        run: python main.py

      - name: Guncellenen durumu kaydet
        run: |
          git config user.name "borsa-bot"
          git config user.email "actions@github.com"
          git add portfolio_state.json docs/trade_log.csv docs/status.json slow_scores_cache.json active_watchlist.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Gun ici calistirma: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
