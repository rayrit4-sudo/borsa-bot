name: Kesif taramasi

on:
  schedule:
    # 06:00 UTC = 09:00 TR, hafta ici, gun ici taramadan once
    - cron: "0 6 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: borsa-bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Kesif taramasini calistir
        run: python discovery.py

      - name: Guncellenen durumu kaydet
        run: |
          git config user.name "borsa-bot"
          git config user.email "actions@github.com"
          git add slow_scores_cache.json active_watchlist.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Kesif taramasi: $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash
          git push
